name: CI

on:
  pull_request:
    branches: [develop, main]
    # labeled/unlabeled: adding or removing `api-breaking-approved` re-runs the contract checks.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [develop, main]

# A new push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compiles, runs unit and Testcontainers tests (Docker is available on the runner).
      - run: ./mvnw -B verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

      # Phase 7 plan PR-66: a staging build, with placeholder values, holds no local address and a robots.txt.
      - name: Build for staging and check the output
        env:
          VITE_API_BASE_URL: https://api.mbia-staging.example.test/api/v1
          VITE_OIDC_AUTHORITY: https://auth.mbia-staging.example.test/realms/mbia
          VITE_OIDC_CLIENT_ID: mbia-web
          VITE_SUPPORT_EMAIL: support@example.test
        run: |
          npm run build:staging
          npm run check:staging-build

  api-lint:
    name: api-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      # Rules: redocly.yaml (recommended set, three rules disabled).
      - run: npx -y @redocly/cli@2.54.3 lint mbia-specs/technical/api/openapi.yaml

  # Staging stack configuration (Phase 7 plan PR-65, PR-68): the realm holds no user nor local address,
  # the Compose files and the Caddyfile are valid, the workflows and deployment scripts pass their linters.
  staging-config:
    name: staging-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - run: python3 -I infrastructure/staging/check-staging-realm.py

      - name: Validate the Compose files
        env:
          MBIA_BACKEND_IMAGE: mbia-backend
          MBIA_KEYCLOAK_IMAGE: mbia-keycloak
          MBIA_ENV_DIR: ./local
        run: |
          docker compose -f infrastructure/staging/compose.yml config -q
          docker compose -f infrastructure/staging/compose.yml -f infrastructure/staging/compose.local.yml config -q

      - name: Validate the Caddyfile
        run: |
          docker run --rm -e MBIA_API_ADDRESS=api.example.test -e MBIA_AUTH_ADDRESS=auth.example.test \
            -v "$PWD/infrastructure/staging/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile

      # Deployment workflow and scripts (Phase 7 plan PR-68). actionlint also runs shellcheck on every `run:`.
      - name: Lint the workflows and the deployment scripts
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            infrastructure/staging/deploy/*.sh infrastructure/terraform/staging/vm-init.sh

  # Staging infrastructure (Phase 7 plan PR-67): formatted and valid. No AWS credentials: nothing is planned here.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infrastructure/terraform/staging
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - run: terraform fmt -check -recursive -diff ..
      # The lock file is committed: init fails if it does not match the pinned provider.
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  api-breaking:
    name: api-breaking
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract the contract of the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git show "origin/${BASE_REF}:mbia-specs/technical/api/openapi.yaml" > "$RUNNER_TEMP/openapi-base.yaml"

      # Fails on breaking changes unless the pull request carries the label `api-breaking-approved` (ADR-003).
      # oasdiff-levels.txt raises the removal of an optional response property (INFO by default) to an error.
      - name: Detect breaking changes
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking-approved') }}
        run: |
          fail_on="--fail-on ERR"
          if [ "$APPROVED" = "true" ]; then
            echo "::notice::Label api-breaking-approved present: breaking changes are reported, not blocking."
            fail_on=""
          fi
          # $fail_on is two words, or none: left unquoted on purpose.
          # shellcheck disable=SC2086
          docker run --rm \
            -v "$RUNNER_TEMP/openapi-base.yaml:/specs/base.yaml:ro" \
            -v "$PWD/mbia-specs/technical/api/openapi.yaml:/specs/head.yaml:ro" \
            -v "$PWD/oasdiff-levels.txt:/specs/levels.txt:ro" \
            tufin/oasdiff:v1.32.1 breaking /specs/base.yaml /specs/head.yaml \
              --severity-levels /specs/levels.txt --format githubactions $fail_on

  # Browser journeys against the real stack: docker compose services, the backend jar and the built frontend.
  e2e:
    name: e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # RustFS holds the Person photos; rustfs-init creates the bucket and its CORS rule (PR-38).
      - name: Start PostgreSQL, RustFS, Mailpit and Keycloak
        run: |
          docker compose up -d --wait --wait-timeout 300 postgres rustfs mailpit keycloak
          docker compose up --exit-code-from rustfs-init rustfs-init

      # Tests already ran in the backend job.
      - name: Start the backend
        working-directory: backend
        run: |
          ./mvnw -B -DskipTests package
          nohup java -jar target/mbia-*.jar --spring.profiles.active=local > "$RUNNER_TEMP/backend.log" 2>&1 &
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/actuator/health

      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Builds the frontend and serves it on http://localhost:5173 (playwright.config.ts).
      - name: Run the E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Collect service logs
        if: failure()
        run: |
          cp "$RUNNER_TEMP/backend.log" frontend/playwright-report/ || true
          docker compose logs keycloak > frontend/playwright-report/keycloak.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
