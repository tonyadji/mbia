spring:
  application:
    name: mbia
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    # Safety net for errors raised outside Spring MVC: never expose internals.
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health

mbia:
  problems:
    # Base of the `type` URI of error responses (technical-specification.md §12).
    base-uri: https://mbia.example.com/problems

---
# Structured JSON logs everywhere except local development (technical-specification.md §19).
# The request identifier is in the logging context as `traceId`.
spring:
  config:
    activate:
      on-profile: "!local"

logging:
  structured:
    format:
      console: ecs

---
# Local development against the docker compose services. Defaults match .env.example;
# values from the repository-root .env (if any) override them.
spring:
  config:
    activate:
      on-profile: local
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${MBIA_DB_NAME:mbia}
    username: ${MBIA_DB_USER:mbia}
    password: ${MBIA_DB_PASSWORD:mbia-local}

logging:
  pattern:
    # Readable logs with the request identifier.
    correlation: "[%X{traceId:-}] "

management:
  endpoint:
    health:
      show-components: always

---
# Automated tests. The datasource is provided by a Testcontainers @ServiceConnection.
spring:
  config:
    activate:
      on-profile: test

management:
  endpoint:
    health:
      show-components: always
