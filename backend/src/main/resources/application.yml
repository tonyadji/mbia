spring:
  application:
    name: mbia
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    # Safety net for errors raised outside Spring MVC: never expose internals.
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health

mbia:
  problems:
    # Base of the `type` URI of error responses (technical-specification.md §12).
    base-uri: https://mbia.example.com/problems
  security:
    # Keycloak realm trusted by the API (ADR-005); no default outside local and test: startup fails without it.
    # issuer-uri:
    audience: mbia-api
    cors:
      allowed-origins: []
  # S3-compatible object storage (ADR-004, ADR-009; Phase 3 plan §3.5). No bucket nor region outside
  # local and test: startup fails without them. `endpoint` is the one the backend reaches (empty for
  # the provider's default); `public-endpoint` the one the browser reaches, for which pre-signed URLs
  # are signed (empty for `endpoint`). Credentials: empty for the default AWS credentials chain.
  storage:
    # bucket:
    # region:
    # endpoint:
    # public-endpoint:
    # access-key:
    # secret-key:
    path-style-access: true
    # Validity of a pre-signed upload (PUT) URL, returned as `expiresAt`.
    upload-url-validity: PT15M
    # Validity of a pre-signed view (GET) URL of an image derivative (data-model.md §13).
    download-url-validity: PT60M
  media:
    # Interval between two runs of the cleanup of expired uploads and unattached photos (ADR-007 §4, OQ-036).
    cleanup-interval: PT1H

---
# Structured JSON logs everywhere except local development (technical-specification.md §19).
# The request identifier is in the logging context as `traceId`.
spring:
  config:
    activate:
      on-profile: "!local"

logging:
  structured:
    format:
      console: ecs

---
# Local development against the docker compose services. Defaults match .env.example;
# values from the repository-root .env (if any) override them.
spring:
  config:
    activate:
      on-profile: local
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${MBIA_DB_NAME:mbia}
    username: ${MBIA_DB_USER:mbia}
    password: ${MBIA_DB_PASSWORD:mbia-local}

mbia:
  security:
    issuer-uri: http://localhost:${KEYCLOAK_PORT:8081}/realms/mbia
    cors:
      allowed-origins: http://localhost:5173
  storage:
    bucket: ${S3_BUCKET:mbia-media}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:http://localhost:${S3_API_PORT:9000}}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:${S3_API_PORT:9000}}
    access-key: ${S3_ACCESS_KEY:mbia-local}
    secret-key: ${S3_SECRET_KEY:mbia-local-secret}

logging:
  pattern:
    # Readable logs with the request identifier.
    correlation: "[%X{traceId:-}] "

management:
  endpoint:
    health:
      show-components: always

---
# Automated tests. The datasource is provided by a Testcontainers @ServiceConnection.
spring:
  config:
    activate:
      on-profile: test

management:
  endpoint:
    health:
      show-components: always

mbia:
  security:
    # Tokens are signed by a test key (TestJwts); KeycloakAuthenticationTest overrides it with a real realm.
    issuer-uri: https://issuer.test/realms/mbia
    cors:
      allowed-origins: http://localhost:5173
  # mbia.storage.* comes from the RustFS container of TestcontainersConfiguration.
  # Tests run the scheduled tasks themselves.
  scheduling:
    enabled: false
